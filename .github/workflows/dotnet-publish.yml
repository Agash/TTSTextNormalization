name: publish

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '*' ]
  release:
    types: [ published ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  build_test_and_pack:
    name: Build, Test, and Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.x
            10.x
            9.x

      - name: Restore Dependencies
        run: dotnet restore TTSTextNormalization.sln

      - name: Build Solution
        run: dotnet build TTSTextNormalization.sln --configuration Release --no-restore

      - name: Run tests
        # Every target framework, not a hand-picked one. The project multi-targets net9.0, net10.0
        # and net11.0, and net11.0 - the framework this ships against - was never being tested.
        run: dotnet test TTSTextNormalization.Tests/TTSTextNormalization.Tests.csproj --configuration Release --no-build -- --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Summarize coverage
        # Renders the cobertura totals into the run summary. Uploading the raw XML alone means nobody
        # ever looks at it; this puts the numbers on the run page itself.
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          files = sorted(glob.glob('**/coverage.cobertura.xml', recursive=True))
          if not files:
              print('### Coverage\n\nNo coverage report was produced.')
              raise SystemExit(0)

          # Multi-targeted runs emit one report per TFM; they cover the same code, so report the first
          # and note how many were produced rather than double-counting.
          root = ET.parse(files[0]).getroot()

          def pct(attr):
              return float(root.get(attr) or 0) * 100

          print('### Coverage\n')
          print('| Metric | Covered | Total | Rate |')
          print('| --- | ---: | ---: | ---: |')
          print(f"| Lines | {root.get('lines-covered')} | {root.get('lines-valid')} | {pct('line-rate'):.1f}% |")
          print(f"| Branches | {root.get('branches-covered')} | {root.get('branches-valid')} | {pct('branch-rate'):.1f}% |")

          packages = root.findall('.//package')
          if packages:
              print('\n<details><summary>Per assembly</summary>\n')
              print('| Assembly | Lines | Branches |')
              print('| --- | ---: | ---: |')
              for p in sorted(packages, key=lambda p: p.get('name') or ''):
                  lr = float(p.get('line-rate') or 0) * 100
                  br = float(p.get('branch-rate') or 0) * 100
                  print(f"| {p.get('name')} | {lr:.1f}% | {br:.1f}% |")
              print('\n</details>')

          if len(files) > 1:
              print(f"\n_{len(files)} reports produced (one per target framework); totals shown for `{files[0]}`._")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          if-no-files-found: warn
          path: '**/coverage.cobertura.xml'

      - name: Pack Library
        run: dotnet pack TTSTextNormalization/TTSTextNormalization.csproj --configuration Release --no-build --output ${{ env.NuGetDirectory }}

      - name: Upload NuGet Packages Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*.nupkg

  deploy:
    name: Deploy Packages to NuGet.org
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [build_test_and_pack]
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/Agash.TTSTextNormalization
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet Packages Artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Agash

      - name: Publish NuGet Packages
        run: |
          Get-ChildItem "${{ env.NuGetDirectory }}" -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.FullName)..."
            dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
